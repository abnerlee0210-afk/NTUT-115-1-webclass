<!DOCTYPE html>
<html>
<head>
<style>
/* unvisited link (未造訪) */
a:link {
  color: yellow;
  text-decoration: underline;
}

/* visited link (已造訪) */
a:visited {
  color: grey;
  text-decoration: underline;
}

/* mouse over link (滑鼠移上去) */
a:hover {
  color: red;
}

/* selected link (按下的瞬間) */
a:active {
  color: pink;
  background-color: yellow;
  text-decoration: underline;
}
</style>
</head>
<body>

<p>Mouse over and click the link: <a href="https://www.w3schools.com" target="_blank">W3Schools</a></p>

</body>
</html>
